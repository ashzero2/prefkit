name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:packages
      - run: pnpm --filter @prefkit/core pack --dry-run
      - run: pnpm --filter @prefkit/mcp pack --dry-run
      - run: pnpm --filter @prefkit/codex pack --dry-run
      - run: pnpm --filter @prefkit/opencode pack --dry-run
      - run: pnpm --filter ./packages/cli pack --dry-run
